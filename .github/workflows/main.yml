
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto Android
        run: |
          unzip -o JARVIS_App_APK_Builder.zip -d extracted
          ROOT=$(find extracted -name settings.gradle.kts -type f -printf '%h\n' | head -1)
          if [ -z "$ROOT" ]; then
            echo "Projeto Gradle não encontrado"
            exit 1
          fi
          cp -a "$ROOT"/. .
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
